name: build

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package
        run: npx electron-forge package

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./out/sm-toolbox-linux-x64/sm-toolbox --no-sandbox --smoke-test

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./out/sm-toolbox-win32-x64/sm-toolbox.exe --smoke-test

      - name: Install maker prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libfuse2

      - name: Make distributables
        run: npx electron-forge make

      - uses: actions/upload-artifact@v4
        with:
          name: sm-toolbox-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
