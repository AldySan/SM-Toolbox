name: Feature request
description: Suggest an idea for SM+ Toolbox.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The project aims to stay simple and comfortable to use, so suggestions that fit that spirit have the best chance of making it in.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today. "Building three images takes too many clicks because..." says more than a feature name.
      placeholder: I build images for several games at once, but...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the behavior you'd want, as if you were explaining it to a friend.
      placeholder: The queue could remember...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve the same problem, including workarounds you use today. Optional.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, sketches, or links to similar behavior in other apps. Optional.
